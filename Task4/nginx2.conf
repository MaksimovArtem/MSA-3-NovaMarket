
http {
    map "$http_client_type" $client_type {
        default "";
        ~*^web$ web;
        ~*^mobile$ mobile;
    }

    map $client_type $limit_key_web {
        default "";
        web $binary_remote_addr;
    }

    map $client_type $limit_key_mobile {
        default "";
        mobile $binary_remote_addr;
    }

    limit_req_zone $limit_key_web zone=web:10m rate=50r/s;
    limit_req_zone $limit_key_mobile zone=mobile:10m rate=30r/s;

    upstream logistics_backend {
        server logistics.company.com max_fails=5 fail_timeout=30s;
    }

    server {
        listen 80;

        location /api/ {
            limit_req zone=web burst=100;
            limit_req zone=mobile burst=60;
            
            proxy_intercept_errors off;
            limit_req_status 429;

            proxy_pass http://backend;
        }
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend;

            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;

            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = /fallback;
        }

        location /fallback {
            default_type application/json;
            return 503 '{"status":"fallback","message":"temporarily unavailable"}';
        }
    }
}
